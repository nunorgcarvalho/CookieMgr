name: Release

# After every merge to main: the changelog fragments (changes/, sim/changes/) become the next version —
# package.json, CHANGELOG.md, dist/ rebuilt, a "vX.Y.Z: …" commit, the tag and a GitHub release. Pull requests never
# bump a version, so they never clash over one. See docs/DEVELOPMENT.md → Releasing.

on:
  push:
    branches: [main]
  workflow_dispatch:

# one release at a time, in merge order; a queued run releases whatever is still waiting
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest
    # the release's own commit (pushed with GITHUB_TOKEN) starts no workflow, but be sure
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release, commit, tag, push
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main --tags
            git reset --hard origin/main
            subject=$(git log -1 --format=%s)
            : > "$RUNNER_TEMP/out"
            GITHUB_OUTPUT="$RUNNER_TEMP/out" node scripts/changes.mjs release
            get() { sed -n "s/^$1=//p" "$RUNNER_TEMP/out"; }
            title=$(get title); version=$(get version); sim_version=$(get sim_version); tags=$(get tags)
            git add -A
            if git diff --cached --quiet; then
              echo 'Nothing to release and dist/ is current.'
              exit 0
            fi
            if [ -n "$title" ]; then
              # "v4.1.0: <the merged PR's title>" — the same history as before
              msg="${title}: ${subject}"
            else
              msg="Rebuild dist/ (${subject})"
            fi
            git commit -q -m "$msg" -m "Released by the Release workflow from the changelog fragments."
            for tag in $tags; do git tag -a "$tag" -m "$tag"; done
            if git push --atomic origin HEAD:main $tags; then
              {
                echo "title=$title"
                echo "version=$version"
                echo "sim_version=$sim_version"
                echo "tags=$tags"
                echo "pushed=true"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main moved during the release (attempt $attempt); starting over on the new main"
            for tag in $tags; do git tag -d "$tag"; done
            sleep $((attempt * 5))
          done
          exit 1
      - name: GitHub release
        if: steps.release.outputs.tags != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in ${{ steps.release.outputs.tags }}; do
            gh release create "$tag" --title "$tag" --notes-file .release-notes.md --verify-tag
          done
      - name: Rebuild GitHub Pages
        # Pages deploys from main; ask for a build in case a GITHUB_TOKEN push doesn't start one
        if: steps.release.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
