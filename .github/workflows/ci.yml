name: CI

on:
  push:
    branches: [main, sim]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the game's scripts, for the simulator's tests (tests/sim) — downloaded once per pinned version
      - uses: actions/cache@v4
        with:
          path: sim/.game
          key: game-${{ hashFiles('sim/game/fetch.mjs') }}
      - name: dist/CookieMgr.js is up to date
        run: npm run check
      - name: Bundle parses
        run: node --check dist/CookieMgr.js
      - name: Lint
        run: npm run lint
      - name: Tests (contract, unit, end-to-end in jsdom)
        run: npm test -- --no-build
