name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: dist/CookieMgr.js is up to date
        run: npm run check
      - name: Bundle parses
        run: node --check dist/CookieMgr.js
