<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CookieSimMgr</title>
    <link rel="icon" href="/game/img/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Kavoon&family=Merriweather:wght@400;700&display=swap" rel="stylesheet" />
    <!-- the add-on's own stylesheet (src/ui/styles.css), then CookieSimMgr's layout -->
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/app/app.css" />
  </head>
  <body>
    <header id="sim-top">
      <span class="sim-logo"></span>
      <span class="sim-title">CookieSimMgr</span>
      <span class="sim-sub" data-sim-versions></span>
      <span class="sim-top-run" data-sim-toprun></span>
    </header>
    <nav id="CookieMgrTab" class="sim-nav" data-sim-nav></nav>
    <main id="CookieMgrMenu" class="sim-main" data-sim-main>
      <div class="ca-card"><div class="ca-card-note">Loading the simulator…</div></div>
    </main>
    <!-- CA.Util.res() puts the game's pictures under Game.resPath: here, the server's cache of the game's CDN -->
    <script>
      window.Game = { resPath: '/game/' };
    </script>
    <script src="/cm.js"></script>
    <script src="/app/chart.js"></script>
    <script src="/app/app.js"></script>
  </body>
</html>
